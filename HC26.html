<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Admisión - United Dental</title>
    <!-- CSS de Intl-Tel-Input para formatear teléfonos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>
    <style>
        :root {
            --primary-color: #1a237e;
            --accent-color: #b71c1c;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --border-color: #cfd8dc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px 10px;
            color: #2c3e50;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 8px;
            border: 2px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding: 25px 20px;
            border-bottom: 6px solid var(--accent-color);
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 28pt;
            font-family: 'Arial Black', Gadget, sans-serif;
            letter-spacing: 1px;
        }

        .header p {
            color: var(--primary-color);
            font-size: 10pt;
            margin: 5px 0 0 0;
            line-height: 1.4;
        }

        .title-bar {
            background-color: #f8f9fa;
            text-align: center;
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .title-bar h2 {
            color: var(--primary-color);
            margin: 0;
            font-size: 14pt;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        form {
            padding: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            font-size: 9.5pt;
            color: #455a64;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 10pt;
            box-sizing: border-box;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 4px rgba(26, 35, 126, 0.3);
        }

        .motivo-highlight {
            background-color: #e8eaf6;
            border-left: 6px solid var(--primary-color);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .signature-box {
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
        }

        .signature-box label {
            text-transform: none;
            font-weight: normal;
            font-size: 9.5pt;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .signature-box input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 11pt;
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #0d47a1;
        }

        .iti { width: 100%; }

        #successScreen {
            display: none;
            padding: 40px 20px;
            text-align: center;
        }

        #successScreen h3 {
            color: var(--primary-color);
            font-size: 18pt;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Encabezado Institucional -->
    <div class="header">
        <h1>United Dental</h1>
        <p>
            Jason 1091 Local 7, Pinamar, BA 7167 | Tel: 02254 48 1005<br>
            <strong>Atención Exclusiva Particular</strong>
        </p>
    </div>

    <div class="title-bar">
        <h2>Ficha de Admisión de Paciente</h2>
    </div>

    <!-- Formulario -->
    <div id="formContainer">
        <form id="hcForm">
            
            <!-- Motivo de Consulta Destacado -->
            <div class="motivo-highlight full-width">
                <div class="form-group">
                    <label for="motivo_consulta" style="color: var(--primary-color); font-size: 10pt;">🚨 Motivo de Consulta / Sintomatología Principal *</label>
                    <textarea id="motivo_consulta" name="motivo_consulta" rows="3" placeholder="Describa brevemente el motivo de su visita o síntoma..." required></textarea>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="apellidos">Apellidos *</label>
                    <input type="text" id="apellidos" name="apellidos" required>
                </div>

                <div class="form-group">
                    <label for="nombres">Nombres *</label>
                    <input type="text" id="nombres" name="nombres" required>
                </div>

                <div class="form-group">
                    <label for="dni">DNI / Pasaporte *</label>
                    <input type="text" id="dni" name="dni" required>
                </div>

                <div class="form-group">
                    <label for="birthdate">Fecha de Nacimiento *</label>
                    <input type="date" id="birthdate" name="birthdate" required onchange="calcularEdad()">
                </div>

                <div class="form-group">
                    <label for="age">Edad</label>
                    <input type="text" id="age" name="age" readonly placeholder="Se calcula automáticamente">
                </div>

                <div class="form-group">
                    <label for="sexo">Sexo *</label>
                    <select id="sexo" name="sexo" required>
                        <option value="">Seleccione...</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nacionalidad">Nacionalidad *</label>
                    <input type="text" id="nacionalidad" name="nacionalidad" value="Argentina" required>
                </div>

                <div class="form-group">
                    <label for="ocupacion">Ocupación</label>
                    <input type="text" id="ocupacion" name="ocupacion">
                </div>

                <div class="form-group full-width">
                    <label for="domicilio">Domicilio *</label>
                    <input type="text" id="domicilio" name="domicilio" placeholder="Calle, número, piso/depto" required>
                </div>

                <div class="form-group">
                    <label for="localidad">Localidad *</label>
                    <input type="text" id="localidad" name="localidad" required>
                </div>

                <div class="form-group">
                    <label for="provincia">Provincia *</label>
                    <input type="text" id="provincia" name="provincia" value="Buenos Aires" required>
                </div>

                <div class="form-group">
                    <label for="cp">Código Postal</label>
                    <input type="text" id="cp" name="cp">
                </div>

                <div class="form-group">
                    <label for="telefono_input">Teléfono (WhatsApp) *</label>
                    <input type="tel" id="telefono_input" required>
                    <input type="hidden" id="telefono" name="telefono">
                </div>

                <div class="form-group full-width">
                    <label for="email">Correo Electrónico *</label>
                    <input type="email" id="email" name="email" required>
                </div>
            </div>

            <!-- Conformidad / Firma Digital -->
            <div class="signature-box full-width">
                <label>
                    <input type="checkbox" id="check_firma" required>
                    <span>Declaro que todos los datos consignados en esta ficha son exactos y verdaderos.</span>
                </label>
                <div class="form-group" style="margin-top: 10px;">
                    <label for="firma_digital_nombre">Nombre Completo del Firmante (Firma Digital) *</label>
                    <input type="text" id="firma_digital_nombre" name="firma_digital_nombre" placeholder="Escriba su Nombre y Apellido completo" required>
                </div>
            </div>

            <button type="button" class="btn-submit" onclick="sendData()">Enviar Formulario de Admisión</button>
        </form>
    </div>

    <!-- Pantalla de Confirmación -->
    <div id="successScreen">
        <h3 style="color: #2e7d32;">✔ ¡Admisión Registrada Exitosamente!</h3>
        <p>Muchas gracias. Los datos de la admisión se guardaron correctamente y el equipo clínico de <strong>United Dental</strong> fue notificado.</p>
    </div>
</div>

<!-- Scripts de Intl-Tel-Input -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
<script>
    // URL de Web App integrada
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwPZmfRbGmOmbIxqK5ujJHBvT2VhKRwwyie3Ax_O-iP5IFxh9k67qWHzoCOTUVY5sgz/exec";

    // Inicializar plugin de teléfono (predeterminado Argentina)
    const phoneInput = document.querySelector("#telefono_input");
    const iti = window.intlTelInput(phoneInput, {
        initialCountry: "ar",
        preferredCountries: ["ar", "uy", "br", "cl", "us"],
        utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js"
    });

    // Calcular edad automática
    function calcularEdad() {
        const fechaNac = document.getElementById("birthdate").value;
        if (!fechaNac) return;
        const hoy = new Date();
        const cumple = new Date(fechaNac);
        let edad = hoy.getFullYear() - cumple.getFullYear();
        const m = hoy.getMonth() - cumple.getMonth();
        if (m < 0 || (m === 0 && hoy.getDate() < cumple.getDate())) {
            edad--;
        }
        document.getElementById("age").value = edad > 0 ? edad + " años" : "0 años";
    }

    // Función de envío adaptada (Evita bloqueos CORS)
    function sendData() {
        const form = document.getElementById('hcForm');
        
        if (!iti.isValidNumber()) {
            alert("El número de teléfono no es válido o está incompleto.");
            phoneInput.focus();
            return;
        }
        
        // Asignar el teléfono formateado con código internacional al campo oculto
        document.getElementById("telefono").value = iti.getNumber();

        if (!form.checkValidity()) {
            alert("Por favor, complete todos los campos requeridos y firme la declaración.");
            form.reportValidity();
            return;
        }

        const formData = new FormData(form);
        const urlParams = new URLSearchParams(formData).toString();

        alert("Sincronizando ficha de admisión con el sistema... Por favor espere.");

        // Enviar petición POST/GET compatible a Google Apps Script
        fetch(`${WEB_APP_URL}?${urlParams}`, { 
            method: 'POST',
            mode: 'no-cors' 
        })
        .then(() => {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
        })
        .catch(error => {
            console.error("Error en la conexión:", error);
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
        });
    }
</script>

</body>
</html>
