<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UDental</title>
    <!-- Librería internacional para selector de países en teléfono (Estilo Google) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <style>
        :root {
            --primary-color: #1a237e;
            --accent-color: #b71c1c;
            --text-color: #2c3e50;
            --border-color: #cfd8dc;
            --bg-input: #f8f9fa;
        }
        
        *, *::before, *::after {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--text-color);
            background-color: #f0f2f5;
            margin: 0;
            padding: 10px;
            font-size: 11pt;
        }

        /* Contenedor Fluido de Ficha en Pantalla */
        .page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto 20px auto;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-radius: 8px;
            padding: 15px;
        }

        .patient-block {
            width: 100%;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            padding: 15px;
            background-color: #ffffff;
        }
        
        /* Cabecera Responsiva */
        .header-dso {
            display: flex;
            flex-direction: column;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
            gap: 10px;
        }
        .clinic-title-large {
            font-size: 24pt;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--primary-color);
            text-align: center;
        }
        .clinic-info {
            text-align: center;
            font-size: 9.5pt;
            color: var(--primary-color);
            line-height: 1.4;
        }
        .title-banner {
            text-align: center;
            color: var(--primary-color);
            font-size: 13pt;
            margin: 10px 0 20px 0;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        
        /* Grid de Formulario Móvil por Defecto */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1px;
            background-color: var(--border-color);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            border-radius: 4px;
            overflow: hidden;
        }
        .form-cell {
            padding: 8px 12px;
            background-color: var(--bg-input);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 60px;
        }
        .label {
            font-size: 8pt;
            font-weight: bold;
            color: #546e7a;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        
        .fill-input, .fill-textarea {
            width: 100%;
            border: none;
            background: transparent;
            font-size: 11pt;
            color: #000000;
            font-family: inherit;
            outline: none;
            padding: 2px 0;
        }
        .fill-textarea {
            resize: none;
            height: 50px;
        }
        
        .sex-options {
            display: flex;
            gap: 15px;
            margin-top: 2px;
        }
        .sex-label {
            display: flex;
            align-items: center;
            font-size: 10.5pt;
            cursor: pointer;
            color: #000000;
        }
        .sex-label input {
            margin-right: 5px;
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
        }
        
        .form-cell:focus-within {
            background-color: #ffffff;
            box-shadow: inset 0 0 0 1px var(--primary-color);
        }
        
        .consent-mini {
            font-size: 9pt;
            text-align: justify;
            line-height: 1.45;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            background-color: #f8f9fa;
            margin-bottom: 20px;
            border-radius: 4px;
        }

        /* Módulo de Firma Digital Responsivo */
        .dso-signature-box {
            background: #fffde7;
            border: 1px dashed #fbc02d;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
        }
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            cursor: pointer;
            font-size: 9.5pt;
            font-weight: bold;
        }
        .checkbox-container input {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            flex-shrink: 0;
            accent-color: #2e7d32;
        }
        .signature-input-group {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Botones de acción */
        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 10pt;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .action-btn:hover { opacity: 0.9; }
        .send-btn { background-color: var(--accent-color); }
        
        /* Botón WhatsApp Oculto Inicialmente */
        .whatsapp-btn {
            display: none;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            font-size: 11pt;
            font-weight: bold;
            border-radius: 6px;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .whatsapp-btn:hover { background-color: #128c7e; }
        
        .iti { width: 100%; }

        /* Media Query para Escritorios y Laptops */
        @media (min-width: 768px) {
            body { padding: 20px; }
            .page { padding: 25px; }
            .patient-block { padding: 20px; }
            
            .header-dso {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
            .clinic-title-large { text-align: left; }
            .clinic-info { text-align: right; }

            .form-grid {
                grid-template-columns: repeat(20, 1fr);
            }
            .c-8  { grid-column: span 8; }
            .c-4  { grid-column: span 4; }
            .c-5  { grid-column: span 5; }
            .c-3  { grid-column: span 3; }
            .c-6  { grid-column: span 6; }
            .c-10 { grid-column: span 10; }
            .c-20 { grid-column: span 20; }
            
            .signature-input-group {
                flex-direction: row;
                align-items: center;
            }
        }

        /* ESTILOS DE IMPRESIÓN EXCLUSIVOS: BLINDAJE EN HOJA A4 ÚNICA */
        @media print {
            @page {
                size: A4;
                margin: 10mm 15mm;
            }
            body { 
                background-color: #ffffff; 
                padding: 0; 
                margin: 0; 
                font-size: 10pt; 
            }
            .form-actions, .whatsapp-btn { display: none !important; }
            .page { 
                max-width: 100%; 
                width: 100%;
                box-shadow: none; 
                padding: 0; 
                margin: 0;
                background: white; 
            }
            
            .form-grid { 
                display: grid !important;
                grid-template-columns: repeat(20, 1fr) !important; 
                gap: 1px; 
                background-color: var(--border-color); 
            }
            .c-8  { grid-column: span 8 !important; } 
            .c-4  { grid-column: span 4 !important; } 
            .c-5  { grid-column: span 5 !important; }
            .c-3  { grid-column: span 3 !important; } 
            .c-6  { grid-column: span 6 !important; } 
            .c-10 { grid-column: span 10 !important; } 
            .c-20 { grid-column: span 20 !important; }
            
            .form-cell { 
                background-color: transparent !important; 
                min-height: 50px; 
                padding: 6px 10px;
            }
            .fill-input { color: #000000 !important; }
            .fill-textarea { height: 40px; }
            .dso-signature-box { background: transparent; border: 1px solid var(--border-color); }
            
            .header-dso { display: flex !important; flex-direction: row !important; justify-content: space-between !important; }
            .clinic-title-large { text-align: left !important; }
            .clinic-info { text-align: right !important; }
            .signature-input-group { display: flex !important; flex-direction: row !important; }
            
            input[type="date"]::-webkit-calendar-picker-indicator { display: none; -webkit-appearance: none; }
        }
    </style>
</head>

## 1. Corrección del desborde: "Firma Electrónica..."

El texto largo se sale del marco en móviles porque, por defecto, los elementos intentan mantenerse en una sola línea. Para solucionarlo, usamos CSS para permitir que el texto se adapte al ancho de la pantalla y haga un salto de línea limpio.

### El CSS que debes aplicar:
```css
.label-firma {
    display: block;
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    word-wrap: break-word; /* Fuerza el salto de línea si es necesario */
    white-space: normal;   /* Permite que el texto ocupe varias líneas */
    font-size: 14px;       /* Un tamaño cómodo para móviles */
    margin-bottom: 8px;
}
