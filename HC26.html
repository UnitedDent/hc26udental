<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>United Dental - Admisión e Historia Clínica de Guardia</title>
  
  <!-- FontAwesome e Intl-Tel-Input CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css">

  <style>
    :root {
      --primary-color: #1a237e;
      --secondary-color: #0d47a1;
      --accent-color: #b71c1c;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --border-color: #cfd8dc;
      --focus-ring: rgba(26, 35, 126, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 20px 10px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
      border-bottom: 2px solid var(--bg-color);
      padding-bottom: 15px;
    }

    .header h1 {
      color: var(--primary-color);
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    .header p {
      color: var(--accent-color);
      font-weight: 600;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 6px;
      color: var(--text-color);
    }

    label i {
      margin-right: 5px;
      color: var(--primary-color);
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s ease;
      background-color: #fafafa;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      background-color: #fff;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    input[readonly] {
      background-color: #e9ecef;
      color: #6c757d;
      cursor: not-allowed;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .iti {
      width: 100%;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background-color: var(--secondary-color);
    }

    .btn-submit:disabled {
      background-color: #90a4ae;
      cursor: not-allowed;
    }

    #statusMessage {
      display: none;
      padding: 12px 15px;
      border-radius: 6px;
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }

    .status-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status-error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    @media (max-width: 600px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1><i class="fa-solid fa-tooth"></i> United Dental</h1>
      <p>Ficha de Admisión e Historia Clínica de Guardia</p>
    </div>

    <form id="admissionForm">
      
      <!-- Apellidos y Nombres -->
      <div class="form-row">
        <div class="form-group">
          <label for="apellidos"><i class="fa-solid fa-user"></i> Apellidos:</label>
          <input type="text" id="apellidos" name="apellidos" placeholder="Ej: Pérez" required>
        </div>
        <div class="form-group">
          <label for="nombres"><i class="fa-solid fa-user"></i> Nombres:</label>
          <input type="text" id="nombres" name="nombres" placeholder="Ej: Juan Carlos" required>
        </div>
      </div>

      <!-- DNI y Fecha de Nacimiento -->
      <div class="form-row">
        <div class="form-group">
          <label for="dni"><i class="fa-solid fa-address-card"></i> DNI / Pasaporte:</label>
          <input type="text" id="dni" name="dni" placeholder="Ej: 35123456" required>
        </div>
        <div class="form-group">
          <label for="birthdate"><i class="fa-solid fa-cake-candles"></i> Fecha de Nacimiento:</label>
          <input type="date" id="birthdate" name="birthdate" required>
        </div>
      </div>

      <!-- Edad y Sexo -->
      <div class="form-row">
        <div class="form-group">
          <label for="age"><i class="fa-solid fa-hourglass-half"></i> Edad (Años):</label>
          <input type="text" id="age" name="age" placeholder="Se calcula automáticamente" readonly>
        </div>
        <div class="form-group">
          <label for="sexo"><i class="fa-solid fa-venus-mars"></i> Sexo Biológico:</label>
          <select id="sexo" name="sexo" required>
            <option value="" disabled selected>Seleccione...</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>

      <!-- Nacionalidad y Ocupación -->
      <div class="form-row">
        <div class="form-group">
          <label for="nacionalidad"><i class="fa-solid fa-globe"></i> Nacionalidad:</label>
          <input type="text" id="nacionalidad" name="nacionalidad" placeholder="Ej: Argentina" value="Argentina" required>
        </div>
        <div class="form-group">
          <label for="ocupacion"><i class="fa-solid fa-briefcase"></i> Ocupación:</label>
          <input type="text" id="ocupacion" name="ocupacion" placeholder="Ej: Empleado / Estudiante">
        </div>
      </div>

      <!-- Domicilio / Ubicación -->
      <div class="form-group">
        <label for="domicilio"><i class="fa-solid fa-location-dot"></i> Domicilio (Calle y Altura / Piso / Depto):</label>
        <input type="text" id="domicilio" name="domicilio" placeholder="Ej: Av. Bunge 450 2A" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="localidad"><i class="fa-solid fa-city"></i> Localidad / Ciudad:</label>
          <input type="text" id="localidad" name="localidad" placeholder="Ej: Pinamar" required>
        </div>
        <div class="form-group">
          <label for="provincia"><i class="fa-solid fa-map-location-dot"></i> Provincia:</label>
          <input type="text" id="provincia" name="provincia" placeholder="Ej: Buenos Aires" value="Buenos Aires" required>
        </div>
        <div class="form-group">
          <label for="cp"><i class="fa-solid fa-mail-bulk"></i> Código Postal:</label>
          <input type="text" id="cp" name="cp" placeholder="Ej: B7167">
        </div>
      </div>

      <!-- Contacto -->
      <div class="form-row">
        <div class="form-group">
          <label for="telefono"><i class="fa-solid fa-phone"></i> Teléfono (WhatsApp):</label>
          <input type="tel" id="telefono" name="telefono_input" required>
          <input type="hidden" id="telefono_full" name="telefono">
        </div>
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> E-mail:</label>
          <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>
      </div>

      <!-- Motivo de Consulta -->
      <div class="form-group">
        <label for="motivo_consulta"><i class="fa-solid fa-comment-medical"></i> Motivo de Consulta / Sintomatología:</label>
        <textarea id="motivo_consulta" name="motivo_consulta" placeholder="Describa brevemente el dolor, molestia o motivo de urgencia..." required></textarea>
      </div>

      <!-- Botón de Envío -->
      <button type="submit" id="submitBtn" class="btn-submit">
        <i class="fa-solid fa-paper-plane"></i> Enviar Ficha de Admisión
      </button>

      <!-- Mensaje de Estado -->
      <div id="statusMessage"></div>

    </form>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
  <script>
    // URL Web App de Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzVFz1xrD_nW8FlxJD9HfGbLpK2ZUmF6U7ndGvsdKU-T2rKmtI9Iuu8LEDXQMnS8sSX/exec";

    // Inicializar selector internacional de WhatsApp
    const phoneInput = document.querySelector("#telefono");
    const iti = window.intlTelInput(phoneInput, {
      initialCountry: "ar",
      preferredCountries: ["ar", "cl", "br", "uy", "py", "us"],
      separateDialCode: true,
      utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js"
    });

    // Calcular Edad según la Fecha de Nacimiento
    const birthdateInput = document.getElementById("birthdate");
    const ageInput = document.getElementById("age");

    birthdateInput.addEventListener("change", function () {
      const birthDate = new Date(this.value);
      if (!isNaN(birthDate)) {
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const monthDiff = today.getMonth() - birthDate.getMonth();
        
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
          age--;
        }
        ageInput.value = age >= 0 ? age : 0;
      } else {
        ageInput.value = "";
      }
    });

    // Manejo del Envío del Formulario
    const form = document.getElementById("admissionForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMessage = document.getElementById("statusMessage");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      // Formato internacional para el teléfono
      document.getElementById("telefono_full").value = iti.getNumber();

      // Feedback visual del botón
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
      statusMessage.style.display = "none";

      const formData = new FormData(form);

      fetch(SCRIPT_URL, {
        method: "POST",
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if (data.result === "success") {
          statusMessage.className = "status-success";
          statusMessage.innerText = "¡Ficha registrada con éxito! Nos comunicaremos a la brevedad.";
          statusMessage.style.display = "block";
          form.reset();
          ageInput.value = "";
        } else {
          throw new Error(data.message || "Error al procesar la solicitud.");
        }
      })
      .catch(error => {
        statusMessage.className = "status-error";
        statusMessage.innerText = "Error al enviar la ficha. Por favor intente nuevamente.";
        statusMessage.style.display = "block";
        console.error("Error:", error);
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Enviar Ficha de Admisión';
      });
    });
  </script>
</body>
</html>
